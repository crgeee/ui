name: Bug Report
description: Report a bug in @artagon/ui
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@artagon/ui version"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: "19.0.0"
  - type: input
    id: tailwind-version
    attributes:
      label: Tailwind CSS version
      placeholder: "4.0.0"
