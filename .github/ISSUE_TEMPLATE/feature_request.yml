name: Feature Request
description: Suggest a new component, hook, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem this would solve
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: If you have a specific API in mind, show example usage
      render: tsx
